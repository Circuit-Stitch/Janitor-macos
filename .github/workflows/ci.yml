# # ci_scripts/ci_post_clone.sh runs. That is the same script Xcode Cloud runs, so running it here is
# # what keeps it working.
# #
# # The second is that the archive still carries the sandbox entitlement. An archive can lose it
# # silently: the build succeeds, the upload succeeds, and review rejects it. The assertion below
# # turns that into a failed build instead.
# #
# # This workflow does not release. Xcode Cloud builds, signs, and uploads to App Store Connect, and
# # it holds the certificates and the App Store Connect key. There is no release lane here.
# #
# # It does not trigger on push, for two reasons that both matter. The runner is a Tart VM on the
# # development Mac and is started by hand, so a push-triggered job would sit queued until somebody
# # booted it — and GitHub cancels a queued job after twenty-four hours. A gate that reports nothing
# # is worse than no gate. And the runner is safe to point at this repository only while the
# # workflows reaching it are dispatched rather than triggered by contributed code. This repository
# # is public, so a fork pull request is not hypothetical here. WirelessOrderTelegraph-kmp's ADR-0010
